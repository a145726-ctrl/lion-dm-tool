<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>行程 DM 產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: left editor (settings + card list), right live A4 preview scaled to fit. Tool chrome is single light theme. */
:root{
  --bg:#eceff1; --panel:#ffffff; --ink:#22292e; --muted:#62707a; --line:#d6dde2;
  --accent:#d8202f; --accent-soft:#fdecee; --ok:#0f6e5a; --warn:#a4470f; --warn-soft:#fdf0e6;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:420px 1fr;grid-template-rows:auto 1fr;height:100%}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{font-size:16px;margin:0}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.panel{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:4px 16px 48px}
.sec{border-bottom:1px solid var(--line);padding:12px 0}
.sec>h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec>h2 .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.fields{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;font-size:14px}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:7px;padding:2px;background:#fff}
textarea{resize:vertical;min-height:40px;line-height:1.5}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.note{font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;background:var(--accent-soft);color:#8a1520}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-ed{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fafbfc}
.card-ed>summary{cursor:pointer;list-style:none;padding:9px 12px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px}
.card-ed>summary::-webkit-details-marker{display:none}
.card-ed>summary .no{color:var(--muted);font-variant-numeric:tabular-nums}
.card-ed>summary .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.card-ed>summary .bad{color:var(--warn);font-size:12px}
.card-ed.hidden-card{opacity:.55}
.card-ed .fields{padding:0 12px 12px}
.dfmt{font-size:12px;color:var(--ok);line-height:1.5}
.dfmt.raw{color:var(--muted)}
.mini{border:none;background:none;cursor:pointer;color:var(--muted);padding:2px 6px;font-size:13px}
.mini:hover{color:var(--ink)}
.preview{overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pv-status{font-size:12px;color:var(--muted);min-height:18px;text-align:center}
.pv-status.warn{color:var(--warn);font-weight:700}
#stageBox{position:relative;flex:none}
#stage{transform-origin:0 0;position:absolute;left:0;top:0;box-shadow:0 6px 30px rgba(20,30,40,.2)}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:12px;max-width:620px;width:100%;max-height:90%;overflow:auto;padding:18px;display:grid;gap:12px}
.modal-card img{max-width:100%;border:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}.panel{overflow:visible;border-right:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ============ DM (A4 794×1123) ============ */
.dm{--tc:#1d6fa5;--pc:#e8383d;--bc:transparent;--bw:0px;--top:340px;--qry:40px;--k:1;
  position:relative;width:794px;height:1123px;overflow:hidden;background:#13a7c4;font-family:var(--font-body);color:#2b2b2b}
.dm-kv{position:absolute;left:0;top:0;width:100%;max-width:none;display:block;cursor:move;user-select:none;-webkit-user-drag:none;touch-action:none}
.dm-kvph{position:absolute;left:0;top:0;width:100%;height:var(--top);display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:20px;font-weight:700;border-bottom:2px dashed rgba(255,255,255,.6)}
.dm-qr{position:absolute;right:var(--qrx);top:var(--qry);width:80px;background:#fff;border-radius:10px;padding:7px 7px 5px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.dm-qr img{width:66px;height:66px;display:block;margin:0 auto;image-rendering:pixelated}
.dm-qr .ph{width:66px;height:66px;margin:0 auto;background:#e9eef0;display:grid;place-items:center;font-size:11px;color:#8a979c}
.dm-qr .lb{font-size:10.5px;color:#444;margin-top:3px;letter-spacing:.05em;white-space:nowrap}
.dm-cards{position:absolute;left:24px;right:24px;top:var(--top);bottom:118px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.dm-card{background:#fff;border-radius:16px;border:var(--bw) solid var(--bc);padding:calc(10px*var(--k)) 16px calc(9px*var(--k));display:flex;flex-direction:column;overflow:hidden;min-height:0}
.dm-card.over{outline:3px solid #ff7a00;outline-offset:-3px}
.c-title{font-weight:900;color:var(--tc);font-size:calc(20px*var(--k));line-height:1.28;letter-spacing:.02em}
.c-pts{list-style:none;margin:calc(4px*var(--k)) 0 0;padding:0;font-weight:700;font-size:calc(13px*var(--k));line-height:1.5;color:#2b2b2b}
.c-pts li{position:relative;padding-left:1em}
.c-pts li .mk{position:absolute;left:0;top:0;font-weight:900}
.c-inline{margin:calc(4px*var(--k)) 0 0;font-weight:700;font-size:calc(13px*var(--k));line-height:1.5;color:#2b2b2b}
.c-bottom{margin-top:auto;padding-top:calc(3px*var(--k))}
.c-info{font-size:calc(11.2px*var(--k));line-height:1.45;color:#555}
.c-info div{overflow-wrap:anywhere}
.c-price{white-space:nowrap;color:var(--pc);line-height:1;text-align:right;margin-top:calc(1px*var(--k))}
.c-price .y{font-size:calc(12px*var(--k));font-weight:700}
.c-price .num{font-size:calc(25px*var(--k));font-weight:900;letter-spacing:.01em;font-variant-numeric:tabular-nums;margin:0 2px}
.c-price .q{font-size:calc(11.5px*var(--k));font-weight:700}
.dm-foot{position:absolute;left:0;right:0;bottom:0;height:104px;background:#fff;display:flex;align-items:center;padding:0 24px 0 32px;gap:24px}
.dm-foot .logo{height:40px;width:auto;flex:none}
.dm-foot .rt{flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:6px}
.dm-foot .disc{font-size:10.5px;color:#444;text-align:right;letter-spacing:.04em}
.dm-foot .box{height:56px;border:1.5px dashed #c9cdd0;border-radius:10px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>行程 DM 產生器</h1>
    <div class="seg" role="group" aria-label="卡片數量" id="countSeg">
      <button type="button" data-n="4">4 張</button><button type="button" data-n="6">6 張</button><button type="button" data-n="8">8 張</button><button type="button" data-n="10">10 張</button>
    </div>
    <span class="sp"></span>
    <a class="btn" href="https://drive.google.com/file/d/1dCVcy40eCUxiVm5tQaRyssBGX5Af0bdn/view?usp=sharing" target="_blank" rel="noopener" style="text-decoration:none;color:var(--ink)">使用說明</a>
    <button class="btn" id="btnPptx" type="button">下載 PPT</button>
    <button class="btn" id="btnPng" type="button">下載 PNG</button>
    <button class="btn primary" id="btnPdf" type="button">下載 PDF</button>
  </header>

  <aside class="panel">
    <section class="sec">
      <h2><span class="n">1</span>匯入行程資料</h2>
      <div class="fields">
        <p class="note" id="sampleFlag">目前是<b>範例資料</b>（取自 618 DM）。貼上資料碼後會被取代。</p>
        <label>貼上「DM 資料碼」（整份會取代全部卡片；單張卡片會加到下一張空白卡）
          <textarea id="jsonIn" rows="2" placeholder='{"cards":[...]}'></textarea>
        </label>
        <div class="inline">
          <button class="btn sm" type="button" id="btnJson">載入資料碼</button>
          <button class="btn sm" type="button" id="btnCopyJson">複製目前資料碼</button>
        </div>
        <div class="inline">
          <button class="btn sm primary" type="button" id="btnSaveCode">下載暫存檔（.txt）</button>
          <label class="btn sm" style="display:inline-flex;color:var(--ink);font-size:13px" for="codeFile">開啟暫存檔</label>
          <input type="file" id="codeFile" accept=".txt,.json,text/plain" hidden>
        </div>
        <p class="hint">暫存檔會存下卡片、主視覺和所有版面設定，換電腦或關掉頁面後都能完整還原。平常的編輯也會自動存在這台電腦的瀏覽器裡。</p>
        <details id="aiBox">
          <summary class="hint" style="cursor:pointer">用 Claude 整理單一行程（需 Claude 帳號）</summary>
          <div class="fields" style="padding-top:8px">
            <label>在行程頁全選複製後貼上
              <textarea id="rawIn" rows="3"></textarea>
            </label>
            <div class="row2">
              <label>填入第幾張<select id="aiTarget"></select></label>
              <label>&nbsp;<button class="btn sm primary" type="button" id="btnAi">整理並填入</button></label>
            </div>
            <div class="inline"><button class="btn sm" type="button" id="btnAiStop" hidden>停止</button><span class="hint" id="aiStatus"></span></div>
          </div>
        </details>
      </div>
    </section>

    <section class="sec">
      <h2><span class="n">2</span>主視覺與檔期設定</h2>
      <div class="fields">
        <label>主視覺圖（設計師提供，寬度會貼齊 A4）<input type="file" id="kvFile" accept="image/*"></label>
        <label>主視覺大小 <span id="kvsVal"></span><input type="range" min="50" max="160" data-k="kvScale" data-num="1"></label>
        <div class="row2">
          <label>主視覺左右<input type="range" min="-500" max="500" data-k="kvX" data-num="1"></label>
          <label>主視覺上下<input type="range" min="-500" max="300" data-k="kvY" data-num="1"></label>
        </div>
        <div class="inline"><button class="btn sm" type="button" id="btnKvReset">主視覺回到原位</button><span class="hint">也可以直接在右邊預覽上拖曳主視覺</span></div>
        <div class="row2">
          <label>下方底色<input type="color" data-k="bg"></label>
          <label>&nbsp;<button class="btn sm" type="button" id="btnPick">從主視覺底部取色</button></label>
        </div>
        <label>卡片起始高度 <span id="topVal"></span><input type="range" min="200" max="560" step="2" data-k="top" data-num="1"></label>
        <label>QR Code 連結（建議用活動頁）<input type="url" data-k="qrLink" placeholder="https://event.liontravel.com/..."></label>
        <div class="row2">
          <label>QR 文字<input type="text" data-k="qrLabel"></label>
          <label>QR 上下位置<input type="range" min="10" max="520" step="2" data-k="qrY" data-num="1"></label>
        </div>
        <div class="row2">
          <label>QR 左右位置<input type="range" min="10" max="700" step="2" data-k="qrX" data-num="1"></label>
          <span></span>
        </div>
        <div class="row3">
          <label>標題色<input type="color" data-k="tc"></label>
          <label>售價色<input type="color" data-k="pc"></label>
          <label>卡片外框色<input type="color" data-k="bc"></label>
        </div>
        <div class="row2">
          <label>外框粗細<select data-k="bw" data-num="1"><option value="0">無外框</option><option value="2">細</option><option value="4">粗</option></select></label>
          <label>副標樣式<select data-k="ptStyle"><option value="list">．條列（一點一行）</option><option value="inline">一行串接（・）</option></select></label>
        </div>
        <label>卡片第二行標籤<select data-k="nameLabel"><option value="標準團名">標準團名</option><option value="產品代碼">產品代碼</option><option value="行程代碼">行程代碼</option></select></label>
        <label>文字大小 <span id="fsVal"></span><input type="range" min="85" max="115" data-k="fs" data-num="1"></label>
      </div>
    </section>

    <section class="sec">
      <h2><span class="n">3</span>行程卡片</h2>
      <p class="hint">出發日期可隨意輸入，例如「7/9 7/23 8/17」或「2027/1/24 1/31」，會自動排成「2027/1/24、1/31」：每個日期都寫月份，不是今年的日期會加上年份；無法辨識的內容（如「7~8月」）會照原文顯示。</p>
      <div id="cardEds"></div>
      <div class="inline" style="margin-top:10px"><button class="btn sm" type="button" id="btnAddCard">＋ 新增卡片</button><button class="btn sm" type="button" id="btnReset">清空全部卡片</button></div>
    </section>
  </aside>

  <main class="preview" id="preview">
    <div class="pv-status" id="pvStatus"></div>
    <div id="stageBox"><div id="stage"><div id="dm" class="dm"></div></div></div>
  </main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card"><strong id="modalTitle"></strong><div id="modalBody"></div><div class="inline"><button class="btn" type="button" id="modalClose">關閉</button></div></div>
</div>
<div class="toast" id="toast" role="status"></div>

    let m;
    if((m=/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/.exec(t))){cy=+m[1];cm=+m[2];out.push([cy,cm,+m[3]]);}
    else if((m=/^(\d{1,2})[\/.\-](\d{1,2})$/.exec(t))){cm=+m[1];cy=null;out.push([null,cm,+m[2]]);}
    else if((m=/^(\d{1,2})$/.exec(t)) && cm){out.push([cy,cm,+m[1]]);}
    else if(/^\(?[一二三四五六日]\)?$/.test(t)) continue;
    else return {ok:false};
  }
  let py=null, pm=null;
  const list=out.filter(([y,m,d])=>m>=1&&m<=12&&d>=1&&d<=31).map(([y,m,d])=>{
    let yy=y; if(!yy){ yy = py==null ? inferYear(m,d) : (m<pm ? py+1 : py); }
    py=yy; pm=m; return {y:yy,m,d,key:yy*10000+m*100+d};});
  if(!list.length) return {ok:false};
  const seen=new Set(); const uniq=list.filter(x=>!seen.has(x.key)&&seen.add(x.key)).sort((a,b)=>a.key-b.key);
  return {ok:true,list:uniq};
}
function formatDates(txt){
  const r=parseDates(txt); if(!r.ok) return {text:String(txt||"").trim(),raw:true};
  let ly=new Date().getFullYear();
  const parts=r.list.map(x=>{ const pre = x.y!==ly ? x.y+"/" : ""; ly=x.y; return pre+x.m+"/"+x.d; });
  return {text:parts.join("、"),raw:false};
}

function readImage(file,maxW,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,maxW/img.width);const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(file.type==="image/png"?c.toDataURL("image/png"):c.toDataURL("image/jpeg",0.92), img.height*sc/c.width);
  };img.src=r.result;};
  r.readAsDataURL(file);
}

    const d=x.getImageData(0,img.height-3,img.width,3).data;let r=0,g=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}

function normCard(o){
  o=o||{}; let pts=o.points??o.highlights??[];
  if(typeof pts==="string") pts=pts.split(/\n|・|．/);
  let dates=o.dates??"";
  if(Array.isArray(dates)) dates=dates.map(d=>typeof d==="string"?d:(d&&d.date)||"").join(" ");
  const p=o.price==null||o.price===""||isNaN(+String(o.price).replace(/,/g,""))?null:+String(o.price).replace(/,/g,"");
  return {title:String(o.title||""),points:pts.map(s=>String(s).trim()).filter(Boolean),stdName:String(o.stdName||o.name||""),dates:String(dates).replace(/-/g,"/"),price:p};
}
const SETTING_KEYS=["bg","top","qrLink","qrLabel","qrY","qrX","tc","pc","bc","bw","ptStyle","fs","nameLabel","kv","kvRatio","kvScale","kvX","kvY"];
function loadCode(t,clearBox){
  t=String(t||"").trim(); if(!t){toast("請先貼上資料碼");return false;}
  let o; try{o=JSON.parse(t.replace(/^```(?:json)?/,"").replace(/```$/,"").trim());}catch(e){toast("資料碼無法解析，請確認有完整複製");return false;}
  if(!Array.isArray(o) && !Array.isArray(o.cards) && (o.title||o.stdName||o.dates)){
    const c=normCard(o); const empty=i=>!S.cards[i]||!(S.cards[i].title||S.cards[i].stdName||S.cards[i].dates);
    if(S.isSample){S.cards=Array.from({length:S.n},BLANK_CARD);}
    let i=S.cards.findIndex((x,k)=>k<S.n&&empty(k)); if(i<0){i=S.cards.length;}
    S.cards[i]=c; if(i>=S.n){const nn=[4,6,8,10].find(x=>x>i)||10; S.n=nn;} while(S.cards.length<S.n) S.cards.push(BLANK_CARD());
    S.isSample=false; if(clearBox) $("#jsonIn").value=""; fillSettings(); renderEditors(); render(); save();
    toast(`已加入第 ${i+1} 張卡片`); return true;
  }
  const cards=Array.isArray(o)?o:o.cards; if(!Array.isArray(cards)||!cards.length){toast("資料碼裡沒有卡片");return false;}
  S.cards=cards.map(normCard);
  const fitN=[4,6,8,10].find(x=>x>=S.cards.length)||10; S.n=o.n&&[4,6,8,10].includes(+o.n)?+o.n:fitN;
  while(S.cards.length<S.n) S.cards.push(BLANK_CARD());
  let full=false;
  if(!Array.isArray(o)) SETTING_KEYS.forEach(k=>{ if(o[k]!==undefined&&o[k]!==null){ S[k]=o[k]; if(k==="kv") full=true; } });
  S.isSample=false; if(clearBox) $("#jsonIn").value=""; fillSettings(); renderEditors(); render(); save();
  toast(full?`已還原 ${cards.length} 張卡片與主視覺`:`已載入 ${cards.length} 張卡片`);
  return true;
}

    if(kind==="pptx") blob=await buildPptx();
    else{ canvas=await capture(); }
    if(kind==="pptx"){}
    else if(kind==="png") blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
    else{const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"p",unit:"mm",format:"a4"});pdf.addImage(canvas.toDataURL("image/jpeg",0.94),"JPEG",0,0,210,297);blob=pdf.output("blob");}
    if(DL){
      try{await DL.save({filename:fname(kind),data:blob});toast("已下載");}
      catch(e){if(e&&e.code==="declined")toast("已取消下載");else if(kind==="pptx")openModal("無法下載 PPT","<p class='hint'>這個檢視環境無法存檔，請改用工具的公開網址下載。</p>");else fallback(kind,canvas);}
    } else if(!inClaude){
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname(kind);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast("已下載");
    } else if(kind==="pptx") openModal("無法下載 PPT","<p class='hint'>這個檢視環境無法存檔，請改用工具的公開網址下載。</p>");
    else fallback(kind,canvas);
  }catch(e){console.error(e);toast(kind==="pptx"?"PPT 產生失敗：請確認網路後重新整理再試":"產生失敗，請再試一次");}
  finally{btn.disabled=false;btn.textContent=lb;}
}
function fallback(kind,canvas){
  openModal("下載",(kind==="pdf"?`<p class="note">這個檢視環境無法直接存 PDF，先提供 PNG。</p>`:"")+`<p class="hint">在圖片上按右鍵「另存圖片」，手機請長按儲存。</p><img alt="DM 預覽" src="${canvas.toDataURL("image/png")}">`);
}
$("#btnPng").onclick=()=>doExport("png");
$("#btnPptx").onclick=()=>doExport("pptx");

/* ---------- PPTX (editable) ---------- */
function loadPptx(){
  if(window.PptxGenJS) return Promise.resolve();
  return new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js";sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});
}
async function buildPptx(){
  await loadPptx();
  const FONT="Microsoft JhengHei", PT=0.75, IN=v=>v/96;
  const hex=c=>String(c||"#ffffff").replace("#","").toUpperCase();
  const dm=$("#dm"), R=dm.getBoundingClientRect(), k=R.width/794;
  const bx=el=>{const r=el.getBoundingClientRect();return {x:(r.left-R.left)/k,y:(r.top-R.top)/k,w:r.width/k,h:r.height/k};};
  const ib=b=>({x:IN(b.x),y:IN(b.y),w:IN(b.w),h:IN(b.h)});
  const fs=el=>parseFloat(getComputedStyle(el).fontSize);
  const pptx=new PptxGenJS(); pptx.defineLayout({name:"A4P",width:IN(794),height:IN(1123)}); pptx.layout="A4P";
  pptx.title=(S.cards[0]&&S.cards[0].title)||"DM";
  const sl=pptx.addSlide(); sl.background={color:hex(S.bg)};
  const T=(text,b,o)=>sl.addText(text,Object.assign({x:IN(b.x),y:IN(b.y),w:IN(b.w),h:IN(b.h),fontFace:FONT,margin:0,valign:"top",fit:"none",wrap:true,paraSpaceBefore:0,paraSpaceAfter:0},o));
  // KV, cropped to the page
  const kv=dm.querySelector(".dm-kv");
  if(kv&&kv.naturalWidth){
    const b=bx(kv); const X0=Math.max(0,b.x),Y0=Math.max(0,b.y),X1=Math.min(794,b.x+b.w),Y1=Math.min(1123,b.y+b.h);
    if(X1>X0&&Y1>Y0){
      const f=kv.naturalWidth/b.w, sw=Math.round((X1-X0)*f), sh=Math.round((Y1-Y0)*f);
      const c=document.createElement("canvas"); c.width=sw; c.height=sh;
      c.getContext("2d").drawImage(kv,(X0-b.x)*f,(Y0-b.y)*f,sw,sh,0,0,sw,sh);
      sl.addImage({data:c.toDataURL("image/png"),x:IN(X0),y:IN(Y0),w:IN(X1-X0),h:IN(Y1-Y0)});
    }
  }
  // QR box
  const qr=dm.querySelector(".dm-qr");
  if(qr){
    const b=bx(qr); sl.addShape(pptx.ShapeType.roundRect,Object.assign(ib(b),{fill:{color:"FFFFFF"},line:{color:"FFFFFF",width:0},rectRadius:IN(10)}));
    const qi=qr.querySelector("img"); if(qi) sl.addImage(Object.assign({data:qi.src},ib(bx(qi))));
    const lb=qr.querySelector(".lb"); if(lb&&lb.textContent) T(lb.textContent,Object.assign(bx(lb),{x:b.x,w:b.w}),{fontSize:fs(lb)*PT,color:"444444",align:"center"});
  }
  // cards
  const lineCol=S.bw?hex(S.bc):"FFFFFF";
  dm.querySelectorAll(".dm-card").forEach(card=>{
    const cb=bx(card);
    sl.addShape(pptx.ShapeType.roundRect,Object.assign(ib(cb),{fill:{color:"FFFFFF"},line:{color:lineCol,width:(S.bw||0)*PT},rectRadius:IN(16)}));
    const inner=t=>({x:t.x,y:t.y,w:Math.min(t.w*1.04,cb.x+cb.w-t.x-6),h:t.h+2});
    const title=card.querySelector(".c-title");
    if(title&&title.textContent) T(title.textContent,inner(bx(title)),{fontSize:fs(title)*PT,bold:true,color:hex(S.tc),lineSpacingMultiple:1.05});
    const pts=card.querySelector(".c-pts"), inl=card.querySelector(".c-inline");
    if(pts){ const lis=[...pts.querySelectorAll("li")].map(li=>"．"+li.textContent.replace(/^．/,""));
      T(lis.map((t,i)=>({text:t,options:{breakLine:i<lis.length-1}})),inner(bx(pts)),{fontSize:fs(pts)*PT,bold:true,color:"2B2B2B",lineSpacingMultiple:1.1}); }
    if(inl&&inl.textContent) T(inl.textContent,inner(bx(inl)),{fontSize:fs(inl)*PT,bold:true,color:"2B2B2B",lineSpacingMultiple:1.1});
    const info=card.querySelector(".c-info");
    if(info&&info.children.length){ const rows=[...info.children].map(d=>d.textContent);
      T(rows.map((t,i)=>({text:t,options:{breakLine:i<rows.length-1}})),inner(bx(info)),{fontSize:fs(info)*PT,color:"555555",lineSpacingMultiple:1.05}); }
    const pr=card.querySelector(".c-price");
    if(pr){ const b=bx(pr), y=pr.querySelector(".y"), n=pr.querySelector(".num"), q=pr.querySelector(".q");
      const pb={x:cb.x+12,y:b.y-3,w:cb.w-28,h:b.h+6};
      T([{text:y.textContent,options:{fontSize:fs(y)*PT,bold:true}},{text:" "+n.textContent+" ",options:{fontSize:fs(n)*PT,bold:true}},{text:q.textContent,options:{fontSize:fs(q)*PT,bold:true}}],pb,{color:hex(S.pc),align:"right",valign:"bottom"}); }
  });
  // footer
  const ft=dm.querySelector(".dm-foot");
  if(ft){
    sl.addShape(pptx.ShapeType.rect,Object.assign(ib(bx(ft)),{fill:{color:"FFFFFF"},line:{color:"FFFFFF",width:0}}));
    const lg=ft.querySelector(".logo"); if(lg) sl.addImage(Object.assign({data:lg.src},ib(bx(lg))));
    const ds=ft.querySelector(".disc"); if(ds) T(ds.textContent,bx(ds),{fontSize:fs(ds)*PT,color:"444444",align:"right"});
    const bxx=ft.querySelector(".box"); if(bxx) sl.addShape(pptx.ShapeType.roundRect,Object.assign(ib(bx(bxx)),{fill:{type:"none"},line:{color:"C9CDD0",width:1.1,dashType:"dash"},rectRadius:IN(10)}));
  }
  return await pptx.write({outputType:"blob"});
}
$("#btnPdf").onclick=()=>doExport("pdf");

/* ---------- drag KV on preview ---------- */
$("#btnKvReset").onclick=()=>{S.kvScale=100;S.kvX=0;S.kvY=0;fillSettings();render();save();};
let drag=null;
$("#dm").addEventListener("pointerdown",e=>{
  if(!e.target.classList.contains("dm-kv")) return;
  e.preventDefault();
  const sc=$("#stage").getBoundingClientRect().width/794;
  drag={x:e.clientX,y:e.clientY,kx:S.kvX||0,ky:S.kvY||0,sc,el:e.target};
  e.target.setPointerCapture(e.pointerId);
});
$("#dm").addEventListener("pointermove",e=>{
  if(!drag) return;
  S.kvX=Math.round(drag.kx+(e.clientX-drag.x)/drag.sc); S.kvY=Math.round(drag.ky+(e.clientY-drag.y)/drag.sc);
  drag.el.style.left=S.kvX+"px"; drag.el.style.top=S.kvY+"px";
});
const endDrag=()=>{ if(!drag) return; drag=null; fillSettings(); save(); };
$("#dm").addEventListener("pointerup",endDrag); $("#dm").addEventListener("pointercancel",endDrag);

/* ---------- init ---------- */
load(); fillSettings(); renderEditors(); render(); fit();
if(inClaude){
  window.claude.use("downloads").then(d=>{DL=d;}).catch(()=>{});
  window.claude.use("sample").then(s=>{SMP=s;if(!s)$("#aiBox").hidden=true;}).catch(()=>{$("#aiBox").hidden=true;});
} else $("#aiBox").hidden=true;
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
